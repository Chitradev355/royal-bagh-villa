{% extends "admin/base_admin.html" %}

{% block title %}Enquiries | Royal Bagh Villa Admin{% endblock %}
{% block page_title %}Customer Enquiries{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h2 class="font-semibold text-gray-800">All Enquiries</h2>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-600 border-b">
                <tr>
                    <th class="px-6 py-3 font-medium">Name</th>
                    <th class="px-6 py-3 font-medium">Email</th>
                    <th class="px-6 py-3 font-medium">Subject</th>
                    <th class="px-6 py-3 font-medium">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center text-gray-500">Enquiries content will be rendered here.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
