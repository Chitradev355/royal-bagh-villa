{% extends "admin/base_admin.html" %}

{% block title %}Settings | Royal Bagh Villa Admin{% endblock %}
{% block page_title %}Business Settings{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden max-w-4xl">
    <div class="p-6">
        <form action="{{ url_for('admin_bp.settings_view') }}" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
                    <input type="text" name="business_name" value="Royal Bagh Villa" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-gold focus:border-brand-gold outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Primary Phone</label>
                    <input type="text" name="phone_primary" value="+91 9876543210" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-gold focus:border-brand-gold outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" name="email_address" value="info@royalbaghvilla.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-gold focus:border-brand-gold outline-none transition-colors">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <textarea name="address_text" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-gold focus:border-brand-gold outline-none transition-colors">123 Heritage Lane, City</textarea>
                </div>
            </div>
            
            <div class="pt-4 border-t border-gray-100 flex justify-end">
                <button type="submit" class="bg-brand-primary text-white px-6 py-2.5 rounded-lg font-medium hover:bg-brand-secondary transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
