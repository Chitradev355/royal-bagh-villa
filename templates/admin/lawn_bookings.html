{% extends "admin/base_admin.html" %}

{% block title %}Lawn Bookings | Royal Bagh Villa Admin{% endblock %}
{% block page_title %}Lawn Bookings{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h2 class="font-semibold text-gray-800">All Lawn Bookings</h2>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-600 border-b">
                <tr>
                    <th class="px-6 py-3 font-medium">Booking ID</th>
                    <th class="px-6 py-3 font-medium">Customer</th>
                    <th class="px-6 py-3 font-medium">Date</th>
                    <th class="px-6 py-3 font-medium">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center text-gray-500">Bookings content will be rendered here.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
